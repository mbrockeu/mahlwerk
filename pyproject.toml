[project]
name = "mahlwerk"
version = "0.1.0"
description = "Self-hosted nutrition diary with barcode scanning"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.30", "httpx>=0.27", "cryptography>=42", "pillow>=11"]

[project.optional-dependencies]
test = ["pytest"]
# local OCR for photographed nutrition tables (about 200 MB with its dependencies)
label = ["rapidocr-onnxruntime>=1.3"]
# recipes from Cookidoo (unofficial interface); the package needs Python 3.12 or newer
cookidoo = ["cookidoo-api>=0.19; python_version >= '3.12'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
