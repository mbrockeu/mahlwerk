name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # hosted runners cost minutes in a private repository; the checks run once it is public
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - name: Run pytest
        run: |
          set -o pipefail
          pytest -q -rf 2>&1 | tee pytest.log
      - name: Show failures as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -15 | sed 's/^/::error::/' || true
          grep -E '^E   ' pytest.log | head -15 | sed 's/^/::error::/' || true

  frontend:
    # hosted runners cost minutes in a private repository; the checks run once it is public
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
